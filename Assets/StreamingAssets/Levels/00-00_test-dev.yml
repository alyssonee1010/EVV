id: 00-00
name: "Test DEV Level"

# Developer stage (0): always listed in Stage Select and never gates the real levels.
# Endless: one Viking every 5 seconds, lane after lane, until you leave through the pause
# menu. Change the unit id below (six times) to test a different Viking.
stage: 0
level: 0

settings:
  rows: 6
  columns: 10
  starting_currency: 100000
  endless: true

available_units:
  - naked_viking

# One pass of the wave list = one Viking per lane, 5 seconds apart; the pass then repeats.
waves:
  - time_offset: 5
    spawns:
      - unit: naked_viking
        lane: 0
        count: 1
        time_offset: 0
      - unit: naked_viking
        lane: 1
        count: 1
        time_offset: 5
      - unit: naked_viking
        lane: 2
        count: 1
        time_offset: 10
      - unit: naked_viking
        lane: 3
        count: 1
        time_offset: 15
      - unit: naked_viking
        lane: 4
        count: 1
        time_offset: 20
      - unit: naked_viking
        lane: 5
        count: 1
        time_offset: 25
